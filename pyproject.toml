[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bananatrade"
version = "0.2.0"
description = "Paper trading research firm"
requires-python = ">=3.12"
dependencies = ["openai", "pydantic>=2", "pyyaml", "python-dotenv", "ccxt", "pandas", "numpy", "httpx", "typer", "onnxruntime>=1.20"]
[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "skl2onnx>=1.17"]
mt5 = ["MetaTrader5>=5.0.5; sys_platform == 'win32'"]
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "hypothesis", "ruff", "mypy"]
[project.scripts]
bananatrade = "bananatrade.cli:main"
bananatrade-web = "bananatrade.web_server:serve"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
[tool.mypy]
strict = true
[[tool.mypy.overrides]]
module = ["pandas", "ccxt", "ccxt.async_support"]
ignore_missing_imports = true
