[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bananatrade"
version = "0.1.0"
description = "Paper trading research firm"
requires-python = ">=3.12"
dependencies = ["openai", "pydantic>=2", "pyyaml", "python-dotenv", "ccxt", "pandas", "numpy", "httpx", "typer"]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "hypothesis", "ruff", "mypy"]
[project.scripts]
bananatrade = "bananatrade.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
[tool.mypy]
strict = true
[[tool.mypy.overrides]]
module = ["pandas", "ccxt", "ccxt.async_support"]
ignore_missing_imports = true
